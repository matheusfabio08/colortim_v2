version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: colortim_db
    environment:
      POSTGRES_DB: colortim
      POSTGRES_USER: colortim_user
      POSTGRES_PASSWORD: colortim_password
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U colortim_user -d colortim']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: colortim_backend
    env_file: .env
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
